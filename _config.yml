# GitHub Pages Configuration
title: "Mathis × Antigravity — What We Built Together"
description: "A showcase of real projects built with Google Antigravity: a 4-bit SoC in SystemVerilog, Raspberry Pi sysadmin automation, and more."
theme: jekyll-theme-cayman
show_downloads: false

# GitHub repository settings
github:
  is_project_page: true
  repository_url: "https://github.com/MathisBonnard/tst_agy2"

# Markdown Processing
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins supported on GitHub Pages
plugins:
  - jekyll-relative-links
  - jekyll-feed
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: true

# Navigation
nav_links:
  - title: "Home"
    url: "/"
  - title: "ChipGPT — 4-bit SoC"
    url: "/docs/chipgpt"
  - title: "Raspberry Pi SysAdmin"
    url: "/docs/rpi-sysadmin"
  - title: "About Antigravity"
    url: "/docs/about-antigravity"
